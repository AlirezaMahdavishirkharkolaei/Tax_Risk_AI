[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taxriskscan"
version = "3.0.0"
description = "Tax-avoidance, profit-shifting and Pillar Two screening for Country-by-Country Reporting data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Alireza Mahdavi Shirkharkolaei" }]
keywords = ["tax", "cbcr", "pillar-two", "beps", "compliance", "legal-tech", "machine-learning"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
app = ["streamlit>=1.45"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=7", "httpx>=0.27", "fastapi>=0.110", "python-multipart>=0.0.9"]

[project.scripts]
taxriskscan = "taxriskscan.cli:main"

[tool.setuptools]
packages = ["taxriskscan"]

[tool.setuptools.package-data]
taxriskscan = ["data/*.csv", "data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
