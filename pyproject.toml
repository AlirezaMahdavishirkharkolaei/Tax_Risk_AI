[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taxriskscan"
version = "1.0.0"
description = "Flag jurisdictions with tax-avoidance and profit-shifting risk in Country-by-Country Reporting data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Alireza Mahdavi Shirkharkolaei" }]
keywords = ["tax", "cbcr", "pillar-two", "beps", "compliance", "legal-tech", "machine-learning"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
app = ["streamlit>=1.45"]
dev = ["pytest>=7"]

[project.scripts]
taxriskscan = "taxriskscan.cli:main"

[tool.setuptools]
packages = ["taxriskscan"]

[tool.setuptools.package-data]
taxriskscan = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
